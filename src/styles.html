<style>
/* ══════════════════════════════════════════════════════════════════════════════
   AF Family Engagement Dashboard — S&D Branded Styles
   Team Systems & Data · Achievement First
   ══════════════════════════════════════════════════════════════════════════════ */

:root {
  --navy: #0A1F5C;
  --dark-navy: #0F1C3F;
  --gold: #F5A623;
  --gold-light: #FFF8E7;
  --af-blue: #0082CA;
  --green: #2E7D52;
  --green-bg: #F0FDF4;
  --amber: #D97706;
  --amber-bg: #FEF3C7;
  --red: #C94136;
  --red-bg: #FEE2E2;
  --light: #F7F9FC;
  --white: #FFFFFF;
  --border: #E2E8F0;
  --text: #1A2332;
  --muted: #607080;
  --card-shadow: 0 1px 4px rgba(0,0,0,0.06);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--light);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Header ──────────────────────────────────────────────────────────────── */

.header {
  background: var(--dark-navy);
  padding: 0 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
  border-bottom: 3px solid var(--gold);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.header-logo {
  position: relative;
  display: inline-block;
  line-height: 0;
}

.header-brand {
  font-size: 14px;
  font-weight: 700;
  color: #D4E0FF;
  letter-spacing: -0.2px;
}

.header-divider {
  width: 1px;
  height: 22px;
  background: rgba(255,255,255,0.15);
}

.header-title {
  font-size: 12px;
  font-weight: 500;
  color: rgba(255,255,255,0.6);
}

.header-meta {
  font-size: 10px;
  color: rgba(255,255,255,0.35);
  letter-spacing: 0.8px;
  text-transform: uppercase;
}

/* ── Navigation ──────────────────────────────────────────────────────────── */

.nav {
  background: rgba(10,31,92,0.4);
  padding: 0 28px;
  display: flex;
  gap: 2px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.nav-btn {
  padding: 11px 18px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  background: none;
  border: none;
  border-bottom: 3px solid transparent;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}

.nav-btn:hover { color: rgba(255,255,255,0.7); }
.nav-btn.active {
  color: var(--gold);
  border-bottom-color: var(--gold);
}

/* ── Main Content ────────────────────────────────────────────────────────── */

.main {
  padding: 24px 28px 60px;
  max-width: 1320px;
  margin: 0 auto;
}

/* ── KPI Strip ───────────────────────────────────────────────────────────── */

.kpi-strip {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

.kpi-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--card-shadow);
}

.kpi-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}

.kpi-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}

.kpi-value {
  font-size: 28px;
  font-weight: 800;
  line-height: 1;
  color: var(--navy);
}

.kpi-sub {
  font-size: 11px;
  color: var(--muted);
  margin-top: 5px;
}

.kpi-badge {
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 12px;
  margin-top: 6px;
}

/* ── Cards ────────────────────────────────────────────────────────────────── */

.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  box-shadow: var(--card-shadow);
}

.card-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.7px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

/* ── Layout Grids ────────────────────────────────────────────────────────── */

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }

/* ── Tables ───────────────────────────────────────────────────────────────── */

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.data-table th {
  padding: 10px 14px;
  text-align: left;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--light);
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
}

.data-table td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}

.data-table tr:hover td {
  background: #F8FAFC;
  cursor: pointer;
}

.data-table tr:last-child td { border-bottom: none; }

/* ── Progress Bars ───────────────────────────────────────────────────────── */

.bar-track {
  height: 8px;
  background: #E8EEF4;
  border-radius: 4px;
  overflow: hidden;
  position: relative;
}

.bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.4s ease;
}

.bar-goal {
  position: absolute;
  top: -3px; bottom: -3px;
  width: 2px;
  background: var(--navy);
  opacity: 0.25;
}

/* ── Badges & Pills ──────────────────────────────────────────────────────── */

.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 10px;
  border-radius: 12px;
  white-space: nowrap;
}

.pill {
  display: inline-block;
  padding: 5px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--white);
  color: var(--navy);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}

.pill:hover { border-color: var(--af-blue); }
.pill.active { border-color: var(--navy); background: var(--navy); color: var(--white); }
.pill.active-blue { border-color: var(--af-blue); background: var(--af-blue); color: var(--white); }
.pill.active-gold { border-color: var(--gold); background: var(--gold); color: var(--navy); }

/* ── Filter Bar ──────────────────────────────────────────────────────────── */

.filter-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.filter-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* ── Section Headers ─────────────────────────────────────────────────────── */

.section-header {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 16px;
}

.section-title {
  font-size: 17px;
  font-weight: 800;
  color: var(--navy);
}

.section-sub {
  font-size: 12px;
  color: var(--muted);
}

/* ── Panel (colored header card) ─────────────────────────────────────────── */

.panel {
  background: var(--white);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: var(--card-shadow);
  margin-bottom: 16px;
}

.panel-header {
  padding: 12px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.panel-header-navy { background: var(--navy); }
.panel-header-gold { background: var(--gold); }

.panel-title { font-size: 14px; font-weight: 800; color: var(--white); }
.panel-sub { font-size: 11px; color: rgba(255,255,255,0.7); }

/* ── Flag Cards ──────────────────────────────────────────────────────────── */

.flag-bright {
  background: var(--green-bg);
  border: 1px solid #86EFAC;
  border-left: 4px solid var(--green);
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 8px;
  cursor: pointer;
}

.flag-concern {
  background: var(--red-bg);
  border: 1px solid #FECACA;
  border-left: 4px solid var(--red);
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 8px;
  cursor: pointer;
}

/* ── Region Cards ────────────────────────────────────────────────────────── */

.region-card {
  border-radius: 10px;
  padding: 16px 20px;
  color: var(--white);
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.15s;
}

.region-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
}

/* ── Tab Content ─────────────────────────────────────────────────────────── */

.tab-content { display: none; }
.tab-content.active { display: block; }

/* ── Compliance Dots ─────────────────────────────────────────────────────── */

.comp-dot {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--white);
  font-weight: 800;
  flex-shrink: 0;
}

/* ── School Picker ───────────────────────────────────────────────────────── */

.school-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}

/* ── Detail Grid ─────────────────────────────────────────────────────────── */

.detail-grid {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 16px;
  align-items: start;
}

/* ── Event Card ──────────────────────────────────────────────────────────── */

.event-card {
  padding: 10px 12px;
  background: var(--light);
  border-radius: 8px;
  border-left: 4px solid #ccc;
}

.event-name { font-size: 12px; font-weight: 700; color: var(--navy); }
.event-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* ── Footer ──────────────────────────────────────────────────────────────── */

.footer {
  text-align: center;
  padding: 16px;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.5px;
}

/* ── Responsive ──────────────────────────────────────────────────────────── */

@media (max-width: 1024px) {
  .kpi-strip { grid-template-columns: repeat(3, 1fr); }
  .grid-3, .grid-4, .grid-5 { grid-template-columns: 1fr 1fr; }
  .detail-grid { grid-template-columns: 1fr; }
}

@media (max-width: 768px) {
  .main { padding: 16px; }
  .header { padding: 0 16px; }
  .nav { padding: 0 16px; }
  .kpi-strip { grid-template-columns: 1fr 1fr; }
  .grid-2 { grid-template-columns: 1fr; }
}

@media print {
  .header, .nav, .filter-bar, .school-picker { display: none; }
  .main { padding: 12px; max-width: 100%; }
}
</style>
