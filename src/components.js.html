<script>
/**
 * AF Family Engagement Dashboard — components.js
 * Reusable UI building blocks.
 */

// ── KPI Card ──────────────────────────────────────────────────────────────────

function renderKPI(label, value, sub, color, badgeText, badgeColor) {
  const badgeHtml = badgeText 
    ? `<span class="kpi-badge" style="background:${badgeColor || color}22;color:${badgeColor || color}">${badgeText}</span>` 
    : '';
  return `
    <div class="kpi-card" style="border-top: 3px solid ${color}">
      <div class="kpi-label">${label}</div>
      <div class="kpi-value" style="color:${color}">${value}</div>
      <div class="kpi-sub">${sub}</div>
      ${badgeHtml}
    </div>`;
}

// ── Progress Bar ──────────────────────────────────────────────────────────────

function renderBar(pct, color, height, goalPct) {
  const w = Math.min(100, Math.max(0, fmtPctRaw(pct)));
  const goalHtml = goalPct 
    ? `<div class="bar-goal" style="left:${fmtPctRaw(goalPct)}%"></div>` 
    : '';
  return `
    <div class="bar-track" style="height:${height || 8}px">
      <div class="bar-fill" style="width:${w}%;background:${color}"></div>
      ${goalHtml}
    </div>`;
}

// ── Badge ─────────────────────────────────────────────────────────────────────

function renderBadge(text, color, bg) {
  const bgColor = bg || (color + '18');
  return `<span class="badge" style="background:${bgColor};color:${color};border:1px solid ${color}33">${text}</span>`;
}

// ── Survey Bar Row (school card style) ────────────────────────────────────────

function renderSurveyBar(cycle, part, fav, fu) {
  const color = surveyColor(part);
  const label = surveyLabel(part);
  const fuDot = `<span style="width:10px;height:10px;border-radius:50%;display:inline-block;background:${fu === 'yes' ? '#2E7D52' : '#C94136'}" title="${fu === 'yes' ? 'Follow-up sent' : 'No follow-up'}"></span>`;
  const favOpacity = part >= 0.65 ? 0.85 : 0.35;
  
  return `
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
        <span style="font-size:11px;font-weight:700;color:var(--navy)">${cycle}</span>
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:10px;font-weight:700;color:${color}">${label}</span>
          ${fuDot}
        </div>
      </div>
      <div class="bar-track" style="height:18px;position:relative">
        <div class="bar-fill" style="width:${fmtPctRaw(part)}%;background:${color}"></div>
        <span style="position:absolute;left:7px;top:1px;font-size:11px;font-weight:800;color:#fff;line-height:18px">${fmtPct(part)}</span>
        <span style="position:absolute;right:7px;top:1px;font-size:10px;color:rgba(255,255,255,${favOpacity});line-height:18px">Fav ${fmtPct(fav)}</span>
      </div>
    </div>`;
}

// ── Compliance Row ────────────────────────────────────────────────────────────

function renderCompRow(label, met, detail) {
  // met: true → pass (green), false → fail (red), 'blank' → not entered yet
  // (neutral grey), anything else (e.g. null) → in-process (amber).
  const bg = met === 'blank' ? NEUTRAL_DOT : met === true ? '#2E7D52' : met === false ? '#C94136' : '#D97706';
  const sym = met === 'blank' ? '–' : met === true ? '✓' : met === false ? '✗' : '~';
  return `
    <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)">
      <div class="comp-dot" style="background:${bg}">${sym}</div>
      <div style="flex:1">
        <div style="font-size:12px;font-weight:700;color:var(--navy)">${label}</div>
        <div style="font-size:10px;color:var(--muted)">${detail}</div>
      </div>
    </div>`;
}

// ── School Table Row ──────────────────────────────────────────────────────────

function renderSchoolRow(school, onclick) {
  const latest = school.latestSurvey || {};
  const partPct = latest.participation_pct;
  const favPct = latest.favorability_pct;
  const favOpacity = partPct >= 0.65 ? 1 : 0.35;
  const trendHtml = school.surveyTrend !== null
    ? `<span style="font-weight:700;color:${school.surveyTrend >= 0 ? '#2E7D52' : '#C94136'}">${school.surveyTrend >= 0 ? '▲' : '▼'} ${Math.abs(Math.round(school.surveyTrend * 100))}pp</span>`
    : '—';
  
  const flagHtml = school.flag === 'bright_spot' 
    ? '<span style="color:#F5A623">⭐</span>' 
    : school.flag === 'concern' 
      ? '<span style="color:#C94136">⚠️</span>' 
      : '';
  
  return `
    <tr onclick="${onclick || ''}" style="cursor:pointer">
      <td style="font-weight:700;color:var(--navy);white-space:nowrap">
        ${school.school_name} ${flagHtml}
        <span style="font-size:9px;color:var(--muted);margin-left:4px">${school.acronym}</span>
      </td>
      <td>${renderBadge(school.state, REGION_COLORS[school.state] || '#607080')}</td>
      <td style="font-size:11px;color:var(--muted)">${school.level}</td>
      <td style="text-align:center">${school.ada_pct ? `<span style="font-weight:700;color:${adaColor(school.ada_pct)}">${fmtPct(school.ada_pct, 1)}</span>` : '—'}</td>
      <td style="text-align:center">${school.chronic_absent_pct ? `<span style="font-weight:700;color:${chronicColor(school.chronic_absent_pct)}">${fmtPct(school.chronic_absent_pct, 1)}</span>` : '—'}</td>
      <td style="text-align:center">${partPct !== undefined && partPct !== '' ? renderBadge(fmtPct(partPct), surveyColor(partPct), surveyBg(partPct)) : '—'}</td>
      <td style="text-align:center">${favPct !== undefined && favPct !== '' ? `<span style="font-weight:700;opacity:${favOpacity}">${fmtPct(favPct)}</span>` : '—'}</td>
      <td style="text-align:center">${trendHtml}</td>
      <td style="text-align:center">${!isBlank(school.flc_status) ? `<span style="color:${flcColor(school.flc_status)};font-weight:700;font-size:11px">${flcLabel(school.flc_status)}</span>` : '—'}</td>
      <td style="text-align:center;color:var(--muted);font-size:12px">${school.eventCount}</td>
    </tr>`;
}

// ── Event Card ────────────────────────────────────────────────────────────────

function renderEventCard(ev) {
  const tc = typeColor(ev.event_type);
  const isEnrollment = ev.event_type === 'Enrollment';
  
  if (isEnrollment) {
    // Count-only display for Enrollment events
    return `
      <div class="event-card" style="border-left-color:${tc}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div class="event-name">${ev.event_name}</div>
            <div class="event-meta">${fmtDate(ev.event_date)}</div>
            <span class="badge" style="background:${tc}18;color:${tc};font-size:9px;margin-top:4px;display:inline-block">${ev.event_type}</span>
          </div>
          <div style="text-align:right">
            <div style="font-size:20px;font-weight:800;color:${tc}">${fmtNum(ev.families_attended)}</div>
            <div style="font-size:9px;color:var(--muted)">families</div>
          </div>
        </div>
      </div>`;
  }
  
  // Percentage-based display for all other types
  const pct = ev.pct_attended;
  const barColor = benchmarkColor(pct, ev.event_type);
  const b = typeBenchmark(ev.event_type);
  
  return `
    <div class="event-card" style="border-left-color:${tc}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="flex:1">
          <div class="event-name">${ev.event_name}</div>
          <div class="event-meta">${fmtDate(ev.event_date)} · ${fmtNum(ev.families_attended)} families</div>
          <span class="badge" style="background:${tc}18;color:${tc};font-size:9px;margin-top:4px;display:inline-block">${ev.event_type}</span>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:18px;font-weight:800;color:${barColor}">${fmtPct(pct, 1)}</div>
          <div style="font-size:9px;color:var(--muted)">${fmtNum(ev.families_attended)} / ${fmtNum(ev.families_enrolled)}</div>
        </div>
      </div>
      <div class="bar-track" style="height:4px;margin-top:6px">
        <div class="bar-fill" style="width:${Math.min(fmtPctRaw(pct), 100)}%;background:${barColor}"></div>
      </div>
      <div style="font-size:9px;color:var(--muted);margin-top:2px">Benchmark: ${fmtPct(b.lo)}–${fmtPct(b.hi)}</div>
    </div>`;
}

// ── Region Summary Card ───────────────────────────────────────────────────────

function renderRegionCard(region, schools) {
  const color = REGION_COLORS[region];
  const avgAda = regionAvg(schools, 'ada_pct');
  const avgChronic = regionAvg(schools, 'chronic_absent_pct');
  const latestPart = regionSurveyAvg(schools, 'December', 'participation_pct');
  const latestFav = regionSurveyAvg(schools, 'December', 'favorability_pct');
  const evtCount = schools.reduce((a, s) => a + s.eventCount, 0);
  
  return `
    <div class="region-card" style="background:${color}" onclick="filterByRegion('${region}')">
      <div style="font-size:16px;font-weight:800;margin-bottom:8px">${REGION_NAMES[region]}</div>
      <div style="font-size:11px;opacity:0.7;margin-bottom:10px">${schools.length} schools · ${evtCount} events</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px">
        <div>
          <div style="opacity:0.6;font-size:10px">ADA</div>
          <div style="font-weight:700">${avgAda ? fmtPct(avgAda, 1) : '—'}</div>
        </div>
        <div>
          <div style="opacity:0.6;font-size:10px">Chr. Absent</div>
          <div style="font-weight:700">${avgChronic ? fmtPct(avgChronic, 1) : '—'}</div>
        </div>
        <div>
          <div style="opacity:0.6;font-size:10px">Survey Part.</div>
          <div style="font-weight:700">${latestPart ? fmtPct(latestPart) : '—'}</div>
        </div>
        <div>
          <div style="opacity:0.6;font-size:10px">Favorability</div>
          <div style="font-weight:700">${latestFav ? fmtPct(latestFav) : '—'}</div>
        </div>
      </div>
    </div>`;
}
</script>
